[package]
name = "openems-matlab"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "MATLAB/Octave compatibility layer for openEMS FDTD solver"

[dependencies]
openems-core = { package = "openems-core", path = "../openems-core" }
csxcad-core = { package = "csxcad-core", path = "../csxcad-core" }

[lib]
crate-type = ["cdylib"]
