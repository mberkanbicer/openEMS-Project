[package]
name = "csxcad-core"
version = "0.1.0"
edition = "2021"
description = "CSXCAD geometry, mesh, material properties and XML serialization in Rust"
license = "LGPL-3.0-or-later"

[dependencies]
fparser = { path = "../fparser", package = "fparser-rs" }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
